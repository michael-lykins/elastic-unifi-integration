---
description: Pipeline for UniFi device metrics collected via the Network API.
processors:
  - set:
      tag: set_ecs_version
      field: ecs.version
      value: "8.11.0"

  - set:
      tag: set_event_kind
      field: event.kind
      value: metric

  - set:
      tag: set_event_type
      field: event.type
      value: info

  # Remove empty uplink / speedtest objects so they don't pollute mappings
  - remove:
      tag: remove_empty_uplink
      field: metrics.unifi.device.uplink
      if: ctx.metrics?.unifi?.device?.uplink != null && ctx.metrics.unifi.device.uplink.isEmpty()
      ignore_missing: true

  - remove:
      tag: remove_empty_speedtest
      field: metrics.unifi.device.speedtest
      if: ctx.metrics?.unifi?.device?.speedtest != null && ctx.metrics.unifi.device.speedtest.isEmpty()
      ignore_missing: true

  # Remove empty wan_ip strings
  - remove:
      tag: remove_empty_wan_ip
      field: metrics.unifi.device.uplink.wan_ip
      if: ctx.metrics?.unifi?.device?.uplink?.wan_ip == ""
      ignore_missing: true

  # Remove zero-value speedtest fields (test not yet run)
  - remove:
      tag: remove_zero_speedtest_down
      field: metrics.unifi.device.speedtest.down_mbps
      if: ctx.metrics?.unifi?.device?.speedtest?.down_mbps == 0
      ignore_missing: true

  - remove:
      tag: remove_zero_speedtest_up
      field: metrics.unifi.device.speedtest.up_mbps
      if: ctx.metrics?.unifi?.device?.speedtest?.up_mbps == 0
      ignore_missing: true

  # Expand the UDM-Pro temperature sensor array (name/value pairs, e.g.
  # CPU/Local/PHY) into named metrics.unifi.device.temp_<sensor>_c fields.
  # CEL can't build dynamically-named map keys from array contents, so the
  # CEL script passes the raw array through and this pipeline does the
  # per-sensor expansion instead.
  - script:
      tag: expand_temperature_sensors
      if: ctx.unifi?.device?.temperatures_raw != null && !ctx.unifi.device.temperatures_raw.isEmpty()
      source: >-
        for (t in ctx.unifi.device.temperatures_raw) {
          if (t.name != null && t.value != null) {
            String lower = t.name.toString().toLowerCase();
            StringBuilder sb = new StringBuilder();
            boolean lastWasSep = false;
            for (int i = 0; i < lower.length(); i++) {
              String ch = lower.substring(i, i + 1);
              if ('abcdefghijklmnopqrstuvwxyz0123456789'.indexOf(ch) >= 0) {
                sb.append(ch);
                lastWasSep = false;
              } else if (!lastWasSep) {
                sb.append('_');
                lastWasSep = true;
              }
            }
            String sensor = sb.toString();
            ctx.metrics.unifi.device['temp_' + sensor + '_c'] = t.value;
          }
        }

  # Expand the UDM-Pro storage partition array (name/used/size, e.g.
  # Temporary/Backup) into metrics.unifi.device.storage.<partition>.* fields.
  # Same dynamic-key limitation as above — expanded here instead of in CEL.
  - script:
      tag: expand_storage_partitions
      if: ctx.unifi?.device?.storage_raw != null && !ctx.unifi.device.storage_raw.isEmpty()
      source: >-
        if (ctx.metrics.unifi.device.storage == null) { ctx.metrics.unifi.device.storage = new HashMap(); }
        for (s in ctx.unifi.device.storage_raw) {
          if (s.name != null) {
            String lower = s.name.toString().toLowerCase();
            StringBuilder sb = new StringBuilder();
            boolean lastWasSep = false;
            for (int i = 0; i < lower.length(); i++) {
              String ch = lower.substring(i, i + 1);
              if ('abcdefghijklmnopqrstuvwxyz0123456789'.indexOf(ch) >= 0) {
                sb.append(ch);
                lastWasSep = false;
              } else if (!lastWasSep) {
                sb.append('_');
                lastWasSep = true;
              }
            }
            String pname = sb.toString();
            long used = s.used != null ? (long) s.used : 0L;
            long size = s.size != null ? (long) s.size : 0L;
            Map part = new HashMap();
            part.put('used_bytes', used);
            part.put('size_bytes', size);
            if (size > 0) {
              part.put('used_pct', Math.round((used / (double) size) * 1000.0) / 10.0);
            }
            ctx.metrics.unifi.device.storage[pname] = part;
          }
        }

  # Normalize the switch/AP port_table array (already filtered to PoE-capable
  # ports by the CEL script) into metrics.unifi.device.poe_ports -- a nested
  # array, one entry per port, not flattened into named fields like the
  # temperature/storage expansions above. Port counts vary a lot by device
  # (5 on an AP, 26 on the 24-port switch), so there's no small fixed set of
  # names to expand into; per-port breakdowns are read back out with ES|QL
  # MV_EXPAND at query time instead.
  - script:
      tag: normalize_poe_ports
      if: ctx.unifi?.device?.poe_ports_raw != null && !ctx.unifi.device.poe_ports_raw.isEmpty()
      source: >-
        List ports = new ArrayList();
        for (p in ctx.unifi.device.poe_ports_raw) {
          Map port = new HashMap();
          port.put('port_idx', p.port_idx);
          port.put('name', p.name);
          port.put('enabled', p.poe_enable != null ? p.poe_enable : false);
          port.put('good', p.poe_good != null ? p.poe_good : false);
          port.put('class', p.poe_class != null ? p.poe_class : '');
          port.put('power_w', p.poe_power != null ? p.poe_power : '0');
          port.put('voltage_v', p.poe_voltage != null ? p.poe_voltage : '0');
          port.put('current_ma', p.poe_current != null ? p.poe_current : '0');
          ports.add(port);
        }
        ctx.metrics.unifi.device.poe_ports = ports;

  - remove:
      tag: remove_temperatures_raw
      field: unifi.device.temperatures_raw
      ignore_missing: true

  - remove:
      tag: remove_storage_raw
      field: unifi.device.storage_raw
      ignore_missing: true

  - remove:
      tag: remove_poe_ports_raw
      field: unifi.device.poe_ports_raw
      ignore_missing: true

on_failure:
  - append:
      field: error.message
      value: >-
        Processor {{ _ingest.on_failure_processor_type }} (tag:
        {{ _ingest.on_failure_processor_tag }}) failed with message:
        {{ _ingest.on_failure_message }}
  - set:
      field: event.kind
      value: pipeline_error
