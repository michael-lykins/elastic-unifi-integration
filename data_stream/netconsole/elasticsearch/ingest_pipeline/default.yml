---
description: Pipeline for UniFi NetConsole raw UDP messages.
processors:
  - set:
      tag: set_ecs_version
      field: ecs.version
      value: "8.11.0"

  - set:
      tag: set_event_module
      field: event.module
      value: unifi

  - set:
      tag: set_event_kind
      field: event.kind
      value: event

  - set:
      tag: set_event_category
      field: event.category
      value: host

  - set:
      tag: set_service_name
      field: service.name
      value: unifi

  # Real wire format is the Linux kernel netconsole protocol:
  # "<PRI>[kernel_seconds.microsecs] message" -- e.g. "<6>[286701.123456] eth0: link up"
  # No hostname or named subsystem token, unlike generic syslog. PRI is the
  # raw kernel printk level (0-7), NOT a combined syslog facility*8+severity.
  # The kernel timestamp is relative to device boot, not wall-clock, so it's
  # kept as a diagnostic field rather than used for @timestamp (event
  # ingestion time is used instead, which is the default when untouched).
  - grok:
      tag: grok_netconsole
      field: message
      patterns:
        - "^<%{NONNEGINT:_tmp.priority}>\\[%{NUMBER:unifi.netconsole.kernel_uptime_sec:float}\\]\\s*%{GREEDYDATA:message}"
      ignore_failure: true

  - script:
      tag: set_priority_name
      if: ctx._tmp?.priority != null
      source: >
        String[] levels = new String[] {"emerg","alert","crit","err","warning","notice","info","debug"};
        int p = Integer.parseInt(ctx._tmp.priority);
        if (p >= 0 && p < levels.length) {
          ctx.unifi.netconsole.priority = levels[p];
        }
      ignore_failure: true

  # Best-effort event classification, mirroring what the old Logstash
  # pipeline classified via keyword matching on the kernel message text.
  - script:
      tag: classify_netconsole_event
      if: ctx.message != null
      source: >
        String m = ctx.message.toLowerCase();
        String category = "other";
        if (m.contains("link is not ready") || m.contains("link becomes ready") || m.contains("link up") || m.contains("link down")) {
          category = "link_state";
        } else if (m.contains("nf_conntrack") || m.contains("conntrack: table full")) {
          category = "conntrack";
        } else if (m.contains("out of memory") || m.contains("oom-kill") || m.contains("killed process")) {
          category = "oom";
        } else if (m.contains("kernel panic") || m.contains("kernel bug") || m.contains("call trace")) {
          category = "kernel_panic";
        } else if (m.contains("driver") && (m.contains("error") || m.contains("fail"))) {
          category = "driver_error";
        }
        ctx.unifi.netconsole.category = category;
      ignore_failure: true

  - remove:
      tag: remove_tmp
      field: _tmp
      ignore_missing: true

on_failure:
  - append:
      field: error.message
      value: >-
        Processor {{ _ingest.on_failure_processor_type }} (tag:
        {{ _ingest.on_failure_processor_tag }}) failed with message:
        {{ _ingest.on_failure_message }}
  - set:
      field: event.kind
      value: pipeline_error
