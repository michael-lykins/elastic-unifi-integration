- version: "0.9.24"
  changes:
    - description: >
        Add a UniFi Protect dashboard: camera KPIs (total/connected/
        disconnected), NVR status (arm mode, doorbell default message),
        a full camera inventory table (state, mic, HDR, video mode,
        package-camera, smart-detect types), a connection-state
        breakdown, a smart-detect-type coverage bar chart (via
        MV_EXPAND on the smart_detect_types array), and a Protect
        Accessories table. Verified all camera/NVR panels against live
        data (3 cameras, 1 NVR). The two accessory panels will show an
        error state until a sensor/light/chime/viewer is ever
        connected -- confirmed live that logs-unifi.protect_accessory-*
        has no backing index yet (zero accessories physically present,
        consistent with the stream's own manifest note); this is
        structural, not a bug, and resolves itself automatically the
        moment real accessory data exists. Used a 15-minute freshness
        window on all panels rather than the client/device streams'
        2-minute convention, since Protect config data polls on a 5m
        interval by default. Added a "Protect" link to the nav strip
        on all 9 existing dashboards for consistency.
      type: enhancement
      link: https://github.com/michael-lykins/elastic-unifi-integration/pull/1
- version: "0.9.23"
  changes:
    - description: >
        Remove the alarm data stream. Its underlying endpoint
        (legacy REST `list/alarm`, per unpoller/unifi's current
        APIEventPathAlarms constant -- confirmed still a live, non-
        deprecated path in that library's source, unlike ips_event)
        returns api.err.InvalidObject on this controller (Network
        v10.4.57) regardless of resource-name variant tried (alarm,
        alarms, rest/alarms, list/notification, stat/alarms) --
        confirmed live against multiple variants, contrasted against
        a known-good resource (rest/wlanconf) succeeding with the
        identical request shape. This is why logs-unifi.alarm-default
        never existed, breaking the "Controller Alarms (24h)" panel on
        the Gateway & Switch Health dashboard (confirmed via user
        screenshot: "Unknown index [logs-unifi.alarm-default]").
        Removed that panel along with the data stream. Unlike
        ips_event, this isn't independently confirmed removed
        upstream -- it may still work on other Network OS versions --
        so treat this as environment-specific until proven otherwise
        on a different controller.
      type: bugfix
      link: https://github.com/michael-lykins/elastic-unifi-integration/pull/1
- version: "0.9.22"
  changes:
    - description: >
        Fix "AP Radios Health" Vega panel on the UniFi Clients dashboard
        rendering as a bare "Error" with no detail (confirmed live via
        user screenshot). Root cause: the data source's
        `format: {property: "aggregations.by_host.buckets"}` was nested
        one level too deep, inside `url`, instead of being a sibling of
        `url`/`name` at the data-entry level -- confirmed by diffing
        against the working PoE Ports panel's spec pulled live from the
        unifi-gsw-health dashboard, which has the correct (sibling)
        placement. Without it in the right place, Vega had no way to
        locate the bucket array in the raw ES aggregation response.
        Connectivity Logs, Client Health, and the DHCP/IP table all
        confirmed working correctly in the same screenshot.
      type: bugfix
      link: https://github.com/michael-lykins/elastic-unifi-integration/pull/1
- version: "0.9.21"
  changes:
    - description: >
        Add a per-client drill-down experience to the UniFi Clients
        dashboard, replicating the UniFi controller's native per-client
        Observability view as closely as Kibana allows. Client stream:
        added tx_retries_pct, noise_dbm, ccq, dhcp_lease_end (computed
        from the dhcpend_time countdown via Painless date-math), and
        is_fixed_ip as flat fields (from stat/sta's
        wifi_tx_retries_percentage/noise/ccq/dhcpend_time/use_fixedip --
        confirmed live, previously unmapped). Device stream: added
        per-radio band statistics (metrics.unifi.device.radios, type
        nested) with band/channel/airtime_pct/interference_pct
        (derived from radio_table_stats' cu_total/cu_self_rx/cu_self_tx)
        /tx_retries_pct/num_stations -- kept nested for the same
        cross-field-correlation reason as poe_ports (v0.9.16/0.9.17),
        confirmed correct via _ingest/pipeline/_simulate against real
        AP data before shipping. Dashboard: added a Controls Options
        List client picker (bound to client.mac -- the first control
        anywhere in this package; the exact panelsJSON/reference schema
        was reverse-engineered from live OOTB Elastic Agent/System OTel
        dashboards on the target cluster rather than hand-authored blind,
        since no local precedent existed), a Client Health table, WAN
        Latency/Up metrics, a Connectivity Logs table (from the existing
        logs-unifi.events syslog stream -- no new capture needed), and a
        DHCP/IP Table. Selecting a client in the picker filters every
        panel sourced from the client or events streams down to that one
        client; leaving it unselected shows all clients (default).
        Scope note: a fully dynamic "AP Health" panel that resolves and
        displays only the selected client's serving AP's radios was
        planned but requires a two-stage reactive Vega query (client doc
        -> observer.mac -> that AP's device doc) with no working local
        precedent and no way to visually verify without interactive
        Kibana access (blocked by SSO login on this browser session).
        Shipped instead as an "AP Radios Health" table showing every AP's
        live per-band airtime/interference/retries (same verified nested-
        aggregation Vega pattern as the PoE Ports panel) -- the selected
        client's AP MAC is visible in the Client Health table's "AP MAC"
        column for manual cross-reference. The literal draggable
        time-scrubber has no native Kibana equivalent and was not
        attempted, per the original plan.
      type: enhancement
      link: https://github.com/michael-lykins/elastic-unifi-integration/pull/1
- version: "0.9.20"
  changes:
    - description: >
        Revert netconsole's listen_port default from 5044 back to 10001.
        The 0.9.12 fix changed it to 5044 to match the UDM-Pro's then-live
        configured NetConsole target, but a subsequent UniFi Network app
        update reorganized the CyberSecure/Traffic Logging UI and reset
        (or the user's config otherwise reverted to) the NetConsole target
        back to port 10001 -- confirmed directly from the live UI
        (Settings -> CyberSecure -> Traffic Logging -> Netconsole Server
        Address 192.168.1.92:10001), which is also UniFi's factory
        default. This exactly explains why netconsole has continued to
        receive zero documents even after the 0.9.12 grok/wire-format fix
        -- the port itself had drifted back out of sync. Updated the live
        package policy's listen_port var on both clusters directly (var
        values are pinned at install time, not affected by a manifest
        default change alone).
      type: bugfix
      link: https://github.com/michael-lykins/elastic-unifi-integration/pull/1
- version: "0.9.19"
  changes:
    - description: >
        Remove the ips_event data stream -- it has never worked, and can't:
        /api/s/{site}/stat/ips/event, the legacy endpoint it polled, was
        removed by Ubiquiti in a recent UniFi Network application update.
        Confirmed two ways: first found and fixed a real bug in the CEL
        script's time-range math (`int(now) / 1000000 - 3600000` doesn't
        convert seconds to milliseconds, it produces a negative start
        timestamp and an end timestamp of ~1970), but the endpoint still
        returned 404 with corrected, valid timestamps. Tried 7+ path
        variations across all three UniFi API generations this package
        already uses elsewhere (legacy REST, Integration v1, and the
        newer "v2" UI-internal API) -- all 404 or route to nothing.
        Independently confirmed by a public report: Unpoller (a
        third-party UniFi monitoring tool) hit the identical 404 on the
        identical endpoint after a UniFi update, and its fix was the same
        conclusion reached here -- stop polling it, there's nothing to
        poll. IDS/IPS is genuinely enabled on this network (confirmed via
        the live threat-category settings, a long list of active Suricata
        rule categories), so this is a real capability loss, not a
        feature being off. Checked whether the events (syslog) stream
        might carry an equivalent -- it doesn't; Security Detection isn't
        one of UniFi's remote-syslog-forwarded categories. Also removed
        the now-orphaned "IPS Detections by Signature" dashboard panel.
        Ubiquiti's own UI has apparently moved this to a unified system
        log view (System Log > Security Detection) with no corresponding
        polling API found; revisit if Ubiquiti ever re-exposes this data
        via the Integration API.
      type: bugfix
      link: https://github.com/michael-lykins/elastic-unifi-integration/pull/1
- version: "0.9.18"
  changes:
    - description: >
        Build the PoE Ports per-port table using a Vega panel with a raw
        Elasticsearch DSL nested aggregation (terms on host.name -> nested
        agg on poe_ports -> filter enabled -> terms on port_idx -> max
        power_w/voltage_v/current_ma), replacing the Lens/ES|QL panel that
        couldn't query the nested field at all. Verified live with real
        correlated per-port data (e.g. port 24: 7.6W/53.8V/142mA) rendered
        correctly on SA-ML-Home-O11y.

        Also fixes a real bug found while verifying the above: Gateway
        CPU % and Gateway Memory % were silently broken since the 0.9.14
        dashboard fix, querying `unifi.unifi.device.type` (double-prefixed)
        instead of `unifi.device.type`. Caused by re-running a broad
        string substitution on already-fixed content during that earlier
        fix pass -- the second pass's un-scoped "device.type" ->
        "unifi.device.type" replacement matched inside the field name its
        own first pass had already produced. Swept every dashboard file
        in the package for the same "X.X." double-prefix pattern; no
        other instances found.
      type: bugfix
      link: https://github.com/michael-lykins/elastic-unifi-integration/pull/1
- version: "0.9.17"
  changes:
    - description: >
        Revert 0.9.16's poe_ports field-type change. Confirmed live that a
        plain object array doesn't actually solve the ES|QL problem the way
        assumed: MV_EXPAND on one sub-field (e.g. port_idx) does not slice
        sibling sub-fields (e.g. power_w) to the matching position -- each
        expands independently, so a naive "expand and correlate" table
        silently pairs the wrong power/voltage/current with the wrong
        port. Reverted metrics.unifi.device.poe_ports to `type: nested`,
        which correctly preserves per-port field correlation (that's the
        entire purpose nested type exists for) -- it's ES|QL specifically
        that can't query nested-typed fields at all right now, not a
        mapping choice that can be worked around at the field-type level.
        The per-port PoE Ports dashboard table stays unbuilt for now (same
        broken state shipped in 0.9.14 for a different reason) pending
        either a Vega panel using a raw DSL nested aggregation, or a
        classic Kibana Lens visualization built interactively against the
        nested field -- both are viable, neither was attempted blind here
        given the risk of shipping another silently-wrong table. The
        underlying per-port data itself is fully captured and correct;
        this is a dashboard-presentation gap, not a data gap.
      type: bugfix
      link: https://github.com/michael-lykins/elastic-unifi-integration/pull/1
- version: "0.9.16"
  changes:
    - description: >
        Fix metrics.unifi.device.poe_ports (added in 0.9.15) so it's
        actually queryable: ES|QL cannot query `nested`-typed fields at
        all, confirmed against a live cluster (`Unknown column` on a field
        that genuinely exists and has real per-port PoE data). Changed the
        field from `type: nested` to `type: group` (a plain object array),
        which ES|QL's MV_EXPAND can read. This trades away nested's strict
        per-object field correlation guarantee, but for a same-poll
        snapshot read back via MV_EXPAND on all its sub-fields together,
        Elasticsearch's preserved array ordering is sufficient. Existing
        deployments need their device data stream rolled over for the
        corrected mapping to apply, since a field's type can't be changed
        on an already-created backing index.
      type: bugfix
      link: https://github.com/michael-lykins/elastic-unifi-integration/pull/1
- version: "0.9.15"
  changes:
    - description: >
        Capture the remaining UniFi Network data the user asked for
        end-to-end: per-port PoE, WLAN/SSID configuration, network/VLAN
        configuration (including dual-WAN and VPN networks), and historical
        speedtest results.

        Per-port PoE: adds metrics.unifi.device.poe_ports (nested array,
        one entry per PoE-capable port) to the existing device stream.
        Deliberately does NOT reuse the temperature/storage expansion
        pattern (flattening into named fields) since port counts vary
        widely by device (5 on an AP, 26 on the 24-port switch) -- read
        individual ports back out with ES|QL MV_EXPAND instead. Also
        deliberately avoids CEL-side nested map()/filter() risk: the CEL
        script only does a flat .filter() passthrough (matching the
        temperatures_raw/storage_raw pattern that's proven safe), and all
        per-port field normalization happens in the ingest pipeline via
        Painless, not in CEL. Verified via _simulate against real
        USW Pro 24 PoE port_table data before touching live Fleet.

        New wlan and network data streams poll wlanconf/networkconf.
        SECURITY NOTE: both endpoints return live secrets in "x_"-prefixed
        fields (x_passphrase is the plaintext WiFi password,
        x_wireguard_private_key is a real VPN private key) -- confirmed
        live on this network during development. Neither stream references
        any "x_"-prefixed field; only an explicit allowlist of safe config
        fields (SSID name/security/VLAN/enabled, network purpose/subnet/
        WAN-failover-priority/VPN-type) is extracted.

        New speedtest data stream polls the report archive on a rolling
        24h window (same POST-with-time-range shape as the existing dpi
        stream) to get trend data, not just the single latest result
        already on the device stream. Overlapping poll windows would
        normally re-index the same historical result repeatedly; fixed by
        carrying UniFi's own record ID through and setting it as the
        Elasticsearch document _id in the ingest pipeline, making repeated
        ingestion of the same result idempotent. Verified via _simulate.

        Explicitly NOT changed: UniFi Protect motion/smart-detect events
        (needs a WebSocket client, still architecturally incompatible with
        CEL polling) and firewall event log volume (this network only has
        logging enabled on 1 of 66 policies -- a UDM-Pro config change for
        the user to make, not a pipeline gap). portconf, firewallgroup,
        routing, dynamicdns, and portforward all return empty on this
        network (unused features) -- not built, straightforward to add
        later the same way if the user starts using them.
      type: enhancement
      link: https://github.com/michael-lykins/elastic-unifi-integration/pull/1
- version: "0.9.14"
  changes:
    - description: >
        Fix the bundled Kibana dashboards, which were still built against
        metrics-unifi.api-default -- the old Logstash unifi-api pipeline's
        index, superseded by this package's own device CEL stream and never
        migrated to the new cluster. UniFi Gateway & Switch Health (8 of 18
        panels) and UniFi Topology (the Vega network diagram, which failed
        entirely since one bad embedded query breaks the whole spec) both
        pointed at the dead index and the old field names (device.name,
        device.type). Repointed both at metrics-unifi.device-default and
        remapped device.name -> host.name, device.type -> unifi.device.type
        (the underlying metric fields were already identical between the
        two pipelines). Total PoE Draw W and the topology view's PoE total
        were rewritten to sum the device-level poe_power_w total across
        devices, since there's no per-port PoE data in CEL. The PoE Ports
        detail table (per-port breakdown) is left broken on purpose --
        that data was never built into the CEL device stream, so there's
        nothing to point it at yet. Also removed the orphaned
        kibana/index_pattern/unifi-api-dv.json data view, which pointed at
        the same dead index and wasn't referenced by any dashboard.

        Separately confirmed NOT a bug: Firewall Events Over Time, Top
        Targeted Ports, Top Firewall Source IPs, Top Firewall Rules, and
        Rule Hit Activity show no data because only 1 of 66 firewall
        policies has logging enabled on this network, not because the
        events pipeline is broken -- its iptables grok/classification
        logic (event.category=firewall, event.action=firewall_block/accept)
        is intact and correct. Likewise IPS Detections by Signature and
        Controller Alarms show "unknown index" because logs-unifi.ips_event
        and logs-unifi.alarm have never produced a document on this
        network (same pre-existing sparse-stream situation as netconsole),
        not because anything is misconfigured.
      type: bugfix
      link: https://github.com/michael-lykins/elastic-unifi-integration/pull/1
- version: "0.9.13"
  changes:
    - description: >
        Add UniFi Protect support: three new CEL data streams polling the
        UniFi Protect Integration API (same UDM-Pro host and API key as the
        existing Network API input, no new credentials needed).
        protect_camera and protect_nvr are verified live against real
        hardware (3 cameras, 1 NVR) and expose capability/config data only --
        connection state, mic/HDR/video-mode settings, smart-detect
        capability list for cameras; arm status and doorbell defaults for
        the NVR. There are no live bitrate/storage/uptime stats available
        through this API for cameras. protect_accessory combines sensors,
        lights, chimes, and viewers into a single stream (sequential
        chained requests, same pattern already proven safe in
        firewall_policy's multi-request CEL program) since none of these
        accessory types exist in this environment to verify field shapes
        against -- only common identity/state fields (id, model_key, name,
        mac, state) are extracted; extend if you own these device types.
        Explicitly NOT implemented: Protect motion/smart-detect events.
        Those are only available via a legacy WebSocket channel
        (/proxy/protect/ws/updates) gated by UI session-cookie auth, not
        the integration API key -- confirmed via direct 404s against every
        plausible REST events endpoint. That's incompatible with Elastic
        Agent's stateless CEL polling model and would need a persistent
        WebSocket client (like a second unifi_client.py-style script) if
        ever pursued -- tracked as a separate, harder problem, not an
        oversight.
      type: enhancement
      link: https://github.com/michael-lykins/elastic-unifi-integration/pull/1
- version: "0.9.12"
  changes:
    - description: >
        Fix the netconsole data stream, which has never actually worked --
        confirmed zero documents ever indexed since this package's initial
        release. Two bugs: the default listen_port (10001) didn't match the
        UDM-Pro's actual configured NetConsole target (5044, per Settings ->
        CyberSecure -> Traffic Logging -> Netconsole), and the ingest
        pipeline's grok pattern assumed a syslog-shaped wire format
        ("TIMESTAMP HOSTNAME WORD: message") when the real Linux kernel
        netconsole protocol is "<PRI>[kernel_seconds.microsecs] message" --
        no hostname or subsystem token, and the bracketed timestamp is
        relative to device boot, not wall-clock. Rewrote the grok pattern
        to match, added unifi.netconsole.priority (decoded from the raw
        kernel printk level 0-7) and unifi.netconsole.category (best-effort
        classification: link_state, conntrack, oom, kernel_panic,
        driver_error, other -- mirroring what the old Logstash
        unifi-netconsole.conf pipeline classified via keyword matching),
        and kept the kernel's relative uptime as a diagnostic field rather
        than trying to use it as @timestamp.
      type: bugfix
      link: https://github.com/michael-lykins/elastic-unifi-integration/pull/1
- version: "0.9.11"
  changes:
    - description: >
        Firmware/release-note audit: the UDM-Pro was upgraded (UniFi OS
        5.1.19 -> 5.1.26, bundling Network App 10.4.57 -> 10.5.67). Nothing
        new found in SNMP or syslog/CEF, but Network App 10.5's new "Rule
        Hit Statistics" feature exposes a real, live field on the gateway:
        `firewall_hits_state.entries` (per-chain, per-rule packet counters
        with last-hit timestamps).

        Investigated adding this as metrics.unifi.device.firewall_hits, but
        deferred it after finding a reproducible runtime issue: any
        non-empty version of this array (mapped via nested `.map()` in CEL,
        via raw passthrough + ingest-pipeline foreach/rename, as `nested`,
        as a plain `object` group, filtered to exclude suspicious values,
        even truncated with `.slice(0, 10)`) silently broke polling for the
        UDM-Pro specifically -- every other device kept getting fresh
        documents every interval while the gateway's stopped entirely, with
        no error surfaced anywhere in the agent logs beyond a generic
        "events were dropped" warning. A single hardcoded one-entry array
        worked fine, and the exact same real 26-entry document indexed
        without issue through `_bulk` and `_ingest/pipeline/_simulate` by
        hand -- so this isn't a document-content or mapping problem, it's
        something in how the live CEL/filebeat input itself handles a
        larger array value, that black-box trial-and-error couldn't pin
        down efficiently. Left out of this release; worth revisiting with
        deeper mito CEL investigation (or an Elastic support/GitHub issue)
        rather than more guessing.
      type: bugfix
      link: https://github.com/michael-lykins/elastic-unifi-integration/pull/1
- version: "0.9.7"
  changes:
    - description: >
        The `device` data stream's CEL/ingest-pipeline collection was built
        before the legacy Logstash unifi-api pipeline's full field coverage
        had been ported over, so it was missing several metrics dashboards
        and users actually depend on for device health: CPU %, memory %,
        1/5/15-minute load averages, memory bytes, and (UDM-Pro only) the
        CPU/Local/PHY temperature sensors and Temporary/Backup storage
        partition usage. This release closes that gap so
        metrics-unifi.device-default reaches parity with metrics-unifi.api-default
        for these fields, clearing the way to eventually retire the old
        Logstash pipeline.

        CPU/memory %  and the load averages arrive from the UniFi API as
        strings that may have leading/trailing padding (e.g. "  2.5") — the
        CEL script passes them through as strings and relies on
        Elasticsearch's default numeric coercion (which trims, the same as
        Java's Float.parseFloat) rather than fighting CEL for a trim
        function.

        The temperature sensor array and storage partition array can't be
        expanded into dynamically-named fields (temp_cpu_c, temp_local_c,
        storage.temporary.*, storage.backup.*) directly in CEL — map
        literals require statically-known keys, and nothing else in this
        package's CEL scripts builds keys from array contents at runtime.
        The CEL script now passes both arrays through as-is into staging
        fields, and two new Painless script processors in the device
        ingest pipeline do the per-item expansion (mirroring what the old
        Logstash pipeline did in Ruby) before the staging fields are
        removed.

        Deliberately deferred to a follow-up: per-port PoE breakdown
        (would need a genuinely new nested-array-flattening CEL pattern —
        parent device array, each with its own child port array — that
        this package has no existing precedent for), and repointing the
        3 dashboards still reading from the old metrics-unifi.api-default
        dataset (unifi-health-dashboard.json, unifi-topology-dashboard.json,
        and unifi-gsw-health.json, the last of which alone has 72 ES|QL
        queries to rewrite).
      type: enhancement
      link: https://github.com/michael-lykins/elastic-unifi-integration/pull/1
- version: "0.9.5"
  changes:
    - description: >
        Replace the Topology map's hand-maintained static node/edge list with
        one derived from live LLDP neighbor data (metrics-unifi.snmp-default,
        snmp.entity_type: lldp_neighbor). The switch self-reports its
        neighbors per port; the diagram now builds its device list from
        metrics-unifi.device-default (the canonical "what devices exist"
        source) and classifies each one's role (Gateway/Core Switch/Access
        Point/Switch) from observer.type plus whether it matches the LLDP
        reporting device. New devices plugged into the switch will now
        appear automatically instead of requiring a manual spec edit.
        LLDP hostnames don't match the pretty device names used elsewhere
        (e.g. "BasementAP" vs "Basement AP"), so both sides are normalized
        (lowercased, spaces/hyphens stripped) before joining.

        Also removed the top-4-per-AP wireless client display cap. Every
        AP's client list now renders in full, with each AP's own block of
        vertical space sized dynamically from its real client count (a
        cumulative-stacking calculation across Vega window transforms) so
        a 14-client AP and a 2-client switch no longer collide. Client rows
        were compacted to a single combined line (hostname + signal dB)
        to keep total panel height reasonable at real client counts.

        Fixed a card sizing bug where the CPU/Mem/WAN/PoE text row (added
        in 0.9.4) rendered 3px below the card's own bottom border.

        Implementation note: two non-obvious Vega gotchas hit during this
        rebuild, both worth remembering — (1) mixing row_number and a
        frame-restricted sum in one window transform silently produces
        wrong results; use separate window transforms. (2) Vega's window
        "frame" takes the absolute value of both boundaries, so a negative
        end offset (e.g. frame:[null,-1], intended as "exclude current
        row") is NOT equivalent to "look backward" — it gets treated as
        +1 (look one row ahead) instead. The correct pattern for a
        running total excluding the current row is an inclusive sum
        followed by subtracting the current row's own value. Both bugs
        were caught by installing vega locally and running the actual
        spec's dataflow against live query results outside Kibana, rather
        than iterating through the Kibana UI — a much faster verification
        loop for Vega work going forward.
      type: enhancement
      link: https://github.com/michael-lykins/elastic-unifi-integration/pull/1
- version: "0.9.4"
  changes:
    - description: >
        Enrich the UniFi Network Topology map (Vega panel) with live host
        stats: CPU % and memory % on every device card, WAN latency on the
        gateway card, and total PoE draw on the core switch card. Also adds
        an overflow indicator ("+N more") beneath an AP's wireless client
        list when it has more clients than the 4-box display cap.

        The topology's node/edge layout (which devices exist, how they're
        wired) is still a hand-maintained static list — this release only
        adds live metrics on top of the existing structure. A follow-up is
        planned to derive the node/edge graph itself from live LLDP
        neighbor and MAC-table data (metrics-unifi.snmp-default) so new
        devices appear automatically instead of requiring a manual edit.
      type: enhancement
      link: https://github.com/michael-lykins/elastic-unifi-integration/pull/1
- version: "0.9.3"
  changes:
    - description: >
        Add UniFi WiFi Health and UniFi Gateway & Switch Health dashboards.
        WiFi Health covers per-radio channel utilization (with other-BSS
        interference breakdown), per-SSID client/throughput/retry detail, and
        AP CPU/memory/load. Gateway & Switch Health covers fleet CPU/memory
        across all devices, UDM-Pro temperatures, gateway TCP health and
        scan/probe signals, per-port PoE draw, LLDP-based switch port map,
        MAC-table clients-per-port, controller subsystem health, and IPS/alarm
        summaries. Both dashboards join the shared UniFi navigation strip
        (now 9 tabs) and use the same service.name: unifi pinned filter as
        the rest of the package. All Lens panels use the package's standard
        ES|QL + adHocDataViews + BUCKET(@timestamp, ...) pattern for correct
        time-range behavior.

        Data dependency: both dashboards read from metrics-unifi.snmp-default
        and metrics-unifi.api-default, which are populated by the standalone
        Logstash SNMP and API-route pipelines (unifi-snmp-gateway.conf,
        unifi-snmp-ap.conf, unifi-snmp-switch.conf, unifi-api.conf) rather
        than this package's own CEL/syslog inputs. Installing this package
        alone will not populate them — the Logstash pipelines must be
        deployed separately (see README).
      type: enhancement
      link: https://github.com/michael-lykins/elastic-unifi-integration/pull/1
- version: "0.9.2"
  changes:
    - description: >
        Improve UniFi syslog ECS parsing for structured controller and AP events.
        Controller CEF records now extract event code/severity/reason plus client,
        WiFi, and connected-device context. AP stahtd tracker JSON and wevent
        custom events now populate ECS network fields and actions instead of
        falling through as unparsed host logs.
      type: enhancement
      link: https://github.com/michael-lykins/elastic-unifi-integration/pull/1
- version: "0.9.1"
  changes:
    - description: >
        Fix firewall policy collection when UniFi policies omit the id field.
        The CEL template now safely falls back to an empty string instead of
        failing decode for those rules.
      type: bugfix
      link: https://github.com/michael-lykins/elastic-unifi-integration/pull/1
- version: "0.9.0"
  changes:
    - description: >
        Rebuild Clients dashboard using metrics-unifi.client-* as the primary data
        source instead of fragile DHCP syslog parsing. New layout: six live KPIs
        (Total, Wireless, Wired, Active SSIDs, Avg Signal dBm, Avg Satisfaction),
        Connected Clients Over Time stacked area (wired/wireless split), Wired vs
        Wireless donut, Clients by SSID / Network / Manufacturer bar charts, WiFi
        Signal Quality bucket chart, Clients by Radio Band (5 GHz vs 2.4 GHz), and
        a full All Connected Clients datatable with hostname, MAC, IP, OUI, network,
        SSID, signal, satisfaction, RX/TX bytes, uptime, and wired flag.
      type: enhancement
      link: https://github.com/michael-lykins/elastic-unifi-integration/issues/29
- version: "0.8.9"
  changes:
    - description: >
        Rethink Firewall dashboard — replace WAN attack-monitoring panels (WAN Events,
        SSH/ICMP/RDP probes, Top Attacking IPs, Protocol Distribution, Attack Types)
        with policy-focused panels: six policy KPIs (total, user-defined, system, logging,
        enabled, disabled), Rule Hit Activity bar chart, Firewall Events Over Time area
        chart, and a full All Policies datatable. Fix ES|QL LIKE "firewall%" operator
        (returns 0 in this Kibana version) — replace with STARTS_WITH() throughout.
        Add Firewall Activity section to Overview dashboard (Blocked Events, Accepted
        Events KPIs, events timeline, Top Targeted Ports). Add firewall_policy_interval
        variable (default 5m) so firewall policy polling is independent of the 60s device
        metrics interval, reducing document volume from ~90k/day to ~18k/day.
      type: enhancement
      link: https://github.com/michael-lykins/elastic-unifi-integration/issues/28
- version: "0.8.8"
  changes:
    - description: >
        Fix firewall event parsing for iptables LOG target (kernel facility). When the
        direct iptables LOG target is used instead of NFLOG/ulogd, syslog-ng rewrites
        PROGRAM to "UDM-Pro kernel" causing the double-hostname grok to fire and set
        process.name="kernel" with the syslog header already stripped. The bracket
        grok was skipped because it only fired when process.name==null. Add a new
        grok_iptables_kernel_log path for the pre-stripped payload format and update
        set_category and set_action conditions to include process.name=="kernel".
        Also adds persistent iptables LOG rule on UDM-Pro (state NEW only) and
        syslog-ng IDS threat forwarding to Elastic.
      type: bugfix
      link: https://github.com/michael-lykins/elastic-unifi-integration/issues/27
- version: "0.8.7"
  changes:
    - description: >
        Fix Firewall dashboard — all 11 event panels were filtering on
        event.category == "firewall" (the pre-ECS value removed in 0.8.3). After
        the ECS fix, firewall events correctly use event.category = "network", so
        the old filter matched nothing in recent data. Panels now filter on
        event.action LIKE "firewall%" which matches firewall_accept, firewall_block,
        and firewall_reject regardless of category value.
      type: bugfix
      link: https://github.com/michael-lykins/elastic-unifi-integration/issues/26
- version: "0.8.6"
  changes:
    - description: >
        ECS compliance fixes for firewall_policy data stream. (1) Change
        source.ip_addresses and destination.ip_addresses from ip to keyword type —
        ip type rejects CIDR notation (e.g. 10.0.0.0/8) which UniFi rules can use;
        keyword safely stores both bare IPs and CIDR ranges. (2) Add ECS rule.id and
        rule.name fields mapped from unifi.firewall_policy.id and .name respectively,
        enabling cross-stream correlation between policy config snapshots and iptables
        hit events in logs-unifi.events-*.
      type: bugfix
      link: https://github.com/michael-lykins/elastic-unifi-integration/issues/25
- version: "0.8.5"
  changes:
    - description: >
        Add full firewall policy filter capture and config change detection.
        CEL collector now captures complete trafficFilter details: source/destination
        MAC addresses, IP addresses, ports, and ip_protocol (critical — missing protocol
        filter is what caused the WAN ICMP rules to compile as ACCEPT-ALL in iptables).
        Ingest pipeline adds SHA-256 config_hash fingerprint via fingerprint processor,
        enabling the Kibana change-detection alerting rule to diff consecutive poll
        windows and fire on any rule add, delete, or modification.
      type: enhancement
      link: https://github.com/michael-lykins/elastic-unifi-integration/issues/24
- version: "0.8.4"
  changes:
    - description: >
        Fix iptables firewall event message field. (1) Extract log.syslog.priority from
        the <PRI> prefix (was silently discarded). (2) Rewrite message from raw syslog
        line to a clean human-readable summary, e.g. "WAN ICMP ECHO - Request: tcp
        177.36.62.220:47459 -> 142.56.57.103:443 in:eth8" — all KV data is already
        parsed into ECS fields so the raw wire format in message was redundant noise.
      type: enhancement
      link: https://github.com/michael-lykins/elastic-unifi-integration/issues/23
- version: "0.8.3"
  changes:
    - description: >
        Fix ECS compliance for iptables/firewall events in the events ingest pipeline.
        (1) Correct event.category from "firewall" (invalid) to "network" (ECS standard).
        (2) Set event.type ("connection" / "denied") and event.outcome ("success") for
        bracket-format iptables events. (3) Lowercase network.transport — iptables PROTO
        field is uppercase (TCP/UDP/ICMP) but ECS requires lowercase. (4) Fix source.mac
        extraction — iptables MAC= field is the full Ethernet frame header (DST:SRC:ETHERTYPE);
        now splits into destination.mac (first 6 octets) and source.mac (next 6 octets),
        formatted per RFC 7042 (uppercase, hyphen-separated). (5) Declare missing ECS fields:
        destination.mac, rule.description, observer.mac, observer.product, user.target.name,
        event.outcome.
      type: enhancement
      link: https://github.com/michael-lykins/elastic-unifi-integration/issues/23
- version: "0.8.2"
  changes:
    - description: Fix syslog panels on Overview, Clients, and Insights dashboards — syslog events now route to logs-unifi.events-* (not logs-unifi.syslog-*) since Elastic Agent 9.3.2. Update all adHocDataView index patterns and ES|QL queries to use logs-unifi.events-* so recent-window time pickers show data correctly.
      type: bugfix
      link: https://github.com/michael-lykins/elastic-unifi-integration/issues/22
- version: "0.8.1"
  changes:
    - description: Fix DHCP Events by AP/Host panel — column mapping referenced client_mac but query groups by iface, causing "invalid column" error.
      type: bugfix
      link: https://github.com/michael-lykins/elastic-unifi-integration/issues/21
- version: "0.8.0"
  changes:
    - description: Fix DPI pie chart (primaryGroups/metrics schema) and table (flat viz format) so Traffic by Category and Top 30 Apps panels render correctly. Add timeFieldName to all adHocDataViews in Devices, Topology, Firewall, and DPI dashboards so the time picker filters correctly. Widen default time range from 24h to 7d on Overview, Clients, Insights, and Firewall dashboards for better syslog/event visibility.
      type: bugfix
      link: https://github.com/michael-lykins/elastic-unifi-integration/issues/21
- version: "0.7.9"
  changes:
    - description: Add DPI dashboard with 9 panels — Total Traffic/Download/Upload/Unique-Apps KPIs, Top 15 Apps horizontal bar, Traffic by Category donut, Download vs Upload stacked bar, and detailed app table. Add DPI nav link to all 6 existing dashboards.
      type: enhancement
      link: https://github.com/michael-lykins/elastic-unifi-integration/issues/20
- version: "0.7.8"
  changes:
    - description: Remove Health dashboard — data is visible in other dashboards. Strip Health nav link from all remaining dashboard nav bars (Overview, Topology, Devices, Clients, Insights, Firewall).
      type: enhancement
      link: https://github.com/michael-lykins/elastic-unifi-integration/issues/19
- version: "0.7.7"
  changes:
    - description: Fix DPI app name resolution — use compound ID (cat*65536+app) for lookup so apps in non-IM categories (SSL/TLS=239GB, QUIC, Zoom, YouTube, Spotify, iCloud, Gmail, Apple.com, etc.) now resolve correctly instead of returning wrong category-0 names. Add missing small-ID entries (MSN, Raidcall, Beanfun). Add TRIM(client_mac) after DISSECT in DHCP queries to strip trailing newline. Fix DHCP Events by AP/Host to group by interface. Fix timeFieldName on all adHocDataViews so all KPI panels respond to dashboard time picker. Fix Health dashboard — Uptime panel was using empty snmp index; WAN Latency and Throughput panels were using zeroed-out Logstash index; all three now read from metrics-unifi.device-default.
      type: bugfix
      link: https://github.com/michael-lykins/elastic-unifi-integration/issues/18
- version: "0.7.6"
  changes:
    - description: Fix DPI data stream for UniFi Network 10.x — migrate from stat/sitedpi (dropped in v10 migration) to stat/report/daily.gw. DPI stats are now read from the embedded dpi map in the daily gateway report and parsed as per-app events, restoring app/category traffic visibility.
      type: bugfix
      link: https://github.com/michael-lykins/elastic-unifi-integration/issues/16
    - description: Fix Most Active Clients panel in Clients dashboard — was querying client.hostname (never populated); now uses DISSECT on raw message to extract client_mac from DHCP syslog entries.
      type: bugfix
      link: https://github.com/michael-lykins/elastic-unifi-integration/issues/17
- version: "0.7.5"
  changes:
    - description: Add Firewall dashboard with 15 panels — WAN attack KPIs, protocol trend, top attacking IPs, top targeted ports, attack type classification, policy zone summary, zone policy matrix (Vega heatmap), and active policy table. Add Firewall nav link to all existing dashboards.
      type: enhancement
      link: https://github.com/michael-lykins/elastic-unifi-integration/issues/15
- version: "0.7.4"
  changes:
    - description: Fix Connected Clients KPI panels (Clients, Overview, Devices dashboards) — was incorrectly summing all polling intervals producing inflated counts; now uses MAX per device in the last 2 minutes then SUM.
      type: bugfix
      link: https://github.com/michael-lykins/elastic-unifi-integration/issues/14
- version: "0.7.3"
  changes:
    - description: Format WAN Throughput as Mbps (converted from bytes/sec), Device Status Table uptime as hours, Topology Uptime chart as decimal hours.
      type: enhancement
      link: https://github.com/michael-lykins/elastic-unifi-integration/issues/13
- version: "0.7.2"
  changes:
    - description: Fix dashboard ES|QL queries to use ECS-mapped observer.type values (udm→router, uap→wap, usw→switch) after CEL template ECS migration.
      type: bugfix
      link: https://github.com/michael-lykins/elastic-unifi-integration/issues/12
- version: "0.7.1"
  changes:
    - description: Bundle all 5 dashboards (Overview, Topology, Devices, Clients, Insights) in the integration package so they install automatically and appear as Managed assets. Vega topology visualization embedded inline.
      type: enhancement
      link: https://github.com/michael-lykins/elastic-unifi-integration/issues/11
- version: "0.7.0"
  changes:
    - description: >
        ECS compliance pass across all data streams. Device identity fields moved to observer.* (observer.name, observer.mac, observer.ip, observer.version, observer.product) and device type normalized to observer.type (router/wap/switch). Events stream firewall interface fields corrected to observer.ingress/egress.interface.name. Client stream adds network.name, network.vlan.id, observer.mac and fixes client.ip to ip type. IPS event stream adds rule.name, event.action, source.geo.country_iso_code. Alarm stream adds observer.mac and source.mac. Rogue AP stream adds network.name and observer.mac. All dashboards updated to use new ECS field paths.
      type: enhancement
      link: https://github.com/michael-lykins/elastic-unifi-integration/issues/10
- version: "0.6.4"
  changes:
    - description: Add DPI app and category name resolution. Ingest pipeline now maps numeric UniFi DPI IDs to human-readable names (app_name, cat_name fields) using the complete 2,120-application and 35-category lookup table extracted directly from the UDM-Pro firmware (/usr/share/dpi/tdts/rule.json).
      type: enhancement
      link: https://github.com/michael-lykins/unifi-telemetry/issues/9
- version: "0.6.3"
  changes:
    - description: Fix DPI data stream — filter out empty records returned by the UniFi sitedpi API when no traffic has been classified (API returns [{}]). Clarify that app and cat fields are numeric IDs, not human-readable names.
      type: bugfix
      link: https://github.com/michael-lykins/unifi-telemetry/issues/9
- version: "0.6.2"
  changes:
    - description: Fix @timestamp timezone — BSD-style syslog timestamps from the UDM-Pro (America/Chicago) were being stored as UTC, placing all events 5 hours in the past. Date processor now uses America/Chicago so CDT/CST timestamps are correctly converted to UTC. ISO8601 timestamps (which carry an explicit offset) are unaffected.
      type: bugfix
      link: https://github.com/michael-lykins/unifi-telemetry/issues/8
- version: "0.6.1"
  changes:
    - description: Fix double-hostname syslog parsing so sshd, sudo, earlyoom, and other UDM-Pro system processes are correctly identified. Add authentication classification for sshd (invalid user, failed password, accepted, disconnect with source IP extraction). Add process classification for sudo. Handle device-forwarded logs from UniFi APs and switches (MAC,model process name → observer.mac + embedded PROG re-parse).
      type: bugfix
      link: https://github.com/michael-lykins/unifi-telemetry/issues/7
- version: "0.6.0"
  changes:
    - description: Add firewall_policy data stream collecting firewall rule configuration (name, action, source/destination zones, ordering index, logging state) from the UniFi Network Integration API v1.
      type: enhancement
      link: https://github.com/michael-lykins/unifi-telemetry/issues/6
- version: "0.5.0"
  changes:
    - description: Fix iptables NFLOG bracket-format parsing in events pipeline so firewall rule-hit messages correctly populate source.ip, destination.ip, rule.name, and network.transport fields.
      type: bugfix
      link: https://github.com/michael-lykins/unifi-telemetry/issues/5
- version: "0.4.0"
  changes:
    - description: Add client, health, alarm, ips_event, dpi, and rogue_ap data streams covering all major UniFi Network Local API endpoints.
      type: enhancement
      link: https://github.com/michael-lykins/unifi-telemetry/issues/4
- version: "0.3.0"
  changes:
    - description: Move UDP host config to top-level (remove udp wrapper) to fix 127.0.0.1:8080 default binding issue.
      type: bugfix
      link: https://github.com/michael-lykins/unifi-telemetry/issues/3
- version: "0.2.0"
  changes:
    - description: Fix duplicate @timestamp in device metrics; remove conflicting input-level UDP vars so per-stream listen_address/listen_port render correctly.
      type: bugfix
      link: https://github.com/michael-lykins/unifi-telemetry/issues/2
- version: "0.1.0"
  changes:
    - description: Initial release. Device metrics via UniFi Network API (CEL input) and syslog events via UDP.
      type: enhancement
      link: https://github.com/michael-lykins/unifi-telemetry/issues/1
