- version: "0.9.7"
  changes:
    - description: >
        The `device` data stream's CEL/ingest-pipeline collection was built
        before the legacy Logstash unifi-api pipeline's full field coverage
        had been ported over, so it was missing several metrics dashboards
        and users actually depend on for device health: CPU %, memory %,
        1/5/15-minute load averages, memory bytes, and (UDM-Pro only) the
        CPU/Local/PHY temperature sensors and Temporary/Backup storage
        partition usage. This release closes that gap so
        metrics-unifi.device-default reaches parity with metrics-unifi.api-default
        for these fields, clearing the way to eventually retire the old
        Logstash pipeline.

        CPU/memory %  and the load averages arrive from the UniFi API as
        strings that may have leading/trailing padding (e.g. "  2.5") — the
        CEL script passes them through as strings and relies on
        Elasticsearch's default numeric coercion (which trims, the same as
        Java's Float.parseFloat) rather than fighting CEL for a trim
        function.

        The temperature sensor array and storage partition array can't be
        expanded into dynamically-named fields (temp_cpu_c, temp_local_c,
        storage.temporary.*, storage.backup.*) directly in CEL — map
        literals require statically-known keys, and nothing else in this
        package's CEL scripts builds keys from array contents at runtime.
        The CEL script now passes both arrays through as-is into staging
        fields, and two new Painless script processors in the device
        ingest pipeline do the per-item expansion (mirroring what the old
        Logstash pipeline did in Ruby) before the staging fields are
        removed.

        Deliberately deferred to a follow-up: per-port PoE breakdown
        (would need a genuinely new nested-array-flattening CEL pattern —
        parent device array, each with its own child port array — that
        this package has no existing precedent for), and repointing the
        3 dashboards still reading from the old metrics-unifi.api-default
        dataset (unifi-health-dashboard.json, unifi-topology-dashboard.json,
        and unifi-gsw-health.json, the last of which alone has 72 ES|QL
        queries to rewrite).
      type: enhancement
      link: https://github.com/michael-lykins/elastic-unifi-integration/pull/1
- version: "0.9.5"
  changes:
    - description: >
        Replace the Topology map's hand-maintained static node/edge list with
        one derived from live LLDP neighbor data (metrics-unifi.snmp-default,
        snmp.entity_type: lldp_neighbor). The switch self-reports its
        neighbors per port; the diagram now builds its device list from
        metrics-unifi.device-default (the canonical "what devices exist"
        source) and classifies each one's role (Gateway/Core Switch/Access
        Point/Switch) from observer.type plus whether it matches the LLDP
        reporting device. New devices plugged into the switch will now
        appear automatically instead of requiring a manual spec edit.
        LLDP hostnames don't match the pretty device names used elsewhere
        (e.g. "BasementAP" vs "Basement AP"), so both sides are normalized
        (lowercased, spaces/hyphens stripped) before joining.

        Also removed the top-4-per-AP wireless client display cap. Every
        AP's client list now renders in full, with each AP's own block of
        vertical space sized dynamically from its real client count (a
        cumulative-stacking calculation across Vega window transforms) so
        a 14-client AP and a 2-client switch no longer collide. Client rows
        were compacted to a single combined line (hostname + signal dB)
        to keep total panel height reasonable at real client counts.

        Fixed a card sizing bug where the CPU/Mem/WAN/PoE text row (added
        in 0.9.4) rendered 3px below the card's own bottom border.

        Implementation note: two non-obvious Vega gotchas hit during this
        rebuild, both worth remembering — (1) mixing row_number and a
        frame-restricted sum in one window transform silently produces
        wrong results; use separate window transforms. (2) Vega's window
        "frame" takes the absolute value of both boundaries, so a negative
        end offset (e.g. frame:[null,-1], intended as "exclude current
        row") is NOT equivalent to "look backward" — it gets treated as
        +1 (look one row ahead) instead. The correct pattern for a
        running total excluding the current row is an inclusive sum
        followed by subtracting the current row's own value. Both bugs
        were caught by installing vega locally and running the actual
        spec's dataflow against live query results outside Kibana, rather
        than iterating through the Kibana UI — a much faster verification
        loop for Vega work going forward.
      type: enhancement
      link: https://github.com/michael-lykins/elastic-unifi-integration/pull/1
- version: "0.9.4"
  changes:
    - description: >
        Enrich the UniFi Network Topology map (Vega panel) with live host
        stats: CPU % and memory % on every device card, WAN latency on the
        gateway card, and total PoE draw on the core switch card. Also adds
        an overflow indicator ("+N more") beneath an AP's wireless client
        list when it has more clients than the 4-box display cap.

        The topology's node/edge layout (which devices exist, how they're
        wired) is still a hand-maintained static list — this release only
        adds live metrics on top of the existing structure. A follow-up is
        planned to derive the node/edge graph itself from live LLDP
        neighbor and MAC-table data (metrics-unifi.snmp-default) so new
        devices appear automatically instead of requiring a manual edit.
      type: enhancement
      link: https://github.com/michael-lykins/elastic-unifi-integration/pull/1
- version: "0.9.3"
  changes:
    - description: >
        Add UniFi WiFi Health and UniFi Gateway & Switch Health dashboards.
        WiFi Health covers per-radio channel utilization (with other-BSS
        interference breakdown), per-SSID client/throughput/retry detail, and
        AP CPU/memory/load. Gateway & Switch Health covers fleet CPU/memory
        across all devices, UDM-Pro temperatures, gateway TCP health and
        scan/probe signals, per-port PoE draw, LLDP-based switch port map,
        MAC-table clients-per-port, controller subsystem health, and IPS/alarm
        summaries. Both dashboards join the shared UniFi navigation strip
        (now 9 tabs) and use the same service.name: unifi pinned filter as
        the rest of the package. All Lens panels use the package's standard
        ES|QL + adHocDataViews + BUCKET(@timestamp, ...) pattern for correct
        time-range behavior.

        Data dependency: both dashboards read from metrics-unifi.snmp-default
        and metrics-unifi.api-default, which are populated by the standalone
        Logstash SNMP and API-route pipelines (unifi-snmp-gateway.conf,
        unifi-snmp-ap.conf, unifi-snmp-switch.conf, unifi-api.conf) rather
        than this package's own CEL/syslog inputs. Installing this package
        alone will not populate them — the Logstash pipelines must be
        deployed separately (see README).
      type: enhancement
      link: https://github.com/michael-lykins/elastic-unifi-integration/pull/1
- version: "0.9.2"
  changes:
    - description: >
        Improve UniFi syslog ECS parsing for structured controller and AP events.
        Controller CEF records now extract event code/severity/reason plus client,
        WiFi, and connected-device context. AP stahtd tracker JSON and wevent
        custom events now populate ECS network fields and actions instead of
        falling through as unparsed host logs.
      type: enhancement
      link: https://github.com/michael-lykins/elastic-unifi-integration/pull/1
- version: "0.9.1"
  changes:
    - description: >
        Fix firewall policy collection when UniFi policies omit the id field.
        The CEL template now safely falls back to an empty string instead of
        failing decode for those rules.
      type: bugfix
      link: https://github.com/michael-lykins/elastic-unifi-integration/pull/1
- version: "0.9.0"
  changes:
    - description: >
        Rebuild Clients dashboard using metrics-unifi.client-* as the primary data
        source instead of fragile DHCP syslog parsing. New layout: six live KPIs
        (Total, Wireless, Wired, Active SSIDs, Avg Signal dBm, Avg Satisfaction),
        Connected Clients Over Time stacked area (wired/wireless split), Wired vs
        Wireless donut, Clients by SSID / Network / Manufacturer bar charts, WiFi
        Signal Quality bucket chart, Clients by Radio Band (5 GHz vs 2.4 GHz), and
        a full All Connected Clients datatable with hostname, MAC, IP, OUI, network,
        SSID, signal, satisfaction, RX/TX bytes, uptime, and wired flag.
      type: enhancement
      link: https://github.com/michael-lykins/elastic-unifi-integration/issues/29
- version: "0.8.9"
  changes:
    - description: >
        Rethink Firewall dashboard — replace WAN attack-monitoring panels (WAN Events,
        SSH/ICMP/RDP probes, Top Attacking IPs, Protocol Distribution, Attack Types)
        with policy-focused panels: six policy KPIs (total, user-defined, system, logging,
        enabled, disabled), Rule Hit Activity bar chart, Firewall Events Over Time area
        chart, and a full All Policies datatable. Fix ES|QL LIKE "firewall%" operator
        (returns 0 in this Kibana version) — replace with STARTS_WITH() throughout.
        Add Firewall Activity section to Overview dashboard (Blocked Events, Accepted
        Events KPIs, events timeline, Top Targeted Ports). Add firewall_policy_interval
        variable (default 5m) so firewall policy polling is independent of the 60s device
        metrics interval, reducing document volume from ~90k/day to ~18k/day.
      type: enhancement
      link: https://github.com/michael-lykins/elastic-unifi-integration/issues/28
- version: "0.8.8"
  changes:
    - description: >
        Fix firewall event parsing for iptables LOG target (kernel facility). When the
        direct iptables LOG target is used instead of NFLOG/ulogd, syslog-ng rewrites
        PROGRAM to "UDM-Pro kernel" causing the double-hostname grok to fire and set
        process.name="kernel" with the syslog header already stripped. The bracket
        grok was skipped because it only fired when process.name==null. Add a new
        grok_iptables_kernel_log path for the pre-stripped payload format and update
        set_category and set_action conditions to include process.name=="kernel".
        Also adds persistent iptables LOG rule on UDM-Pro (state NEW only) and
        syslog-ng IDS threat forwarding to Elastic.
      type: bugfix
      link: https://github.com/michael-lykins/elastic-unifi-integration/issues/27
- version: "0.8.7"
  changes:
    - description: >
        Fix Firewall dashboard — all 11 event panels were filtering on
        event.category == "firewall" (the pre-ECS value removed in 0.8.3). After
        the ECS fix, firewall events correctly use event.category = "network", so
        the old filter matched nothing in recent data. Panels now filter on
        event.action LIKE "firewall%" which matches firewall_accept, firewall_block,
        and firewall_reject regardless of category value.
      type: bugfix
      link: https://github.com/michael-lykins/elastic-unifi-integration/issues/26
- version: "0.8.6"
  changes:
    - description: >
        ECS compliance fixes for firewall_policy data stream. (1) Change
        source.ip_addresses and destination.ip_addresses from ip to keyword type —
        ip type rejects CIDR notation (e.g. 10.0.0.0/8) which UniFi rules can use;
        keyword safely stores both bare IPs and CIDR ranges. (2) Add ECS rule.id and
        rule.name fields mapped from unifi.firewall_policy.id and .name respectively,
        enabling cross-stream correlation between policy config snapshots and iptables
        hit events in logs-unifi.events-*.
      type: bugfix
      link: https://github.com/michael-lykins/elastic-unifi-integration/issues/25
- version: "0.8.5"
  changes:
    - description: >
        Add full firewall policy filter capture and config change detection.
        CEL collector now captures complete trafficFilter details: source/destination
        MAC addresses, IP addresses, ports, and ip_protocol (critical — missing protocol
        filter is what caused the WAN ICMP rules to compile as ACCEPT-ALL in iptables).
        Ingest pipeline adds SHA-256 config_hash fingerprint via fingerprint processor,
        enabling the Kibana change-detection alerting rule to diff consecutive poll
        windows and fire on any rule add, delete, or modification.
      type: enhancement
      link: https://github.com/michael-lykins/elastic-unifi-integration/issues/24
- version: "0.8.4"
  changes:
    - description: >
        Fix iptables firewall event message field. (1) Extract log.syslog.priority from
        the <PRI> prefix (was silently discarded). (2) Rewrite message from raw syslog
        line to a clean human-readable summary, e.g. "WAN ICMP ECHO - Request: tcp
        177.36.62.220:47459 -> 142.56.57.103:443 in:eth8" — all KV data is already
        parsed into ECS fields so the raw wire format in message was redundant noise.
      type: enhancement
      link: https://github.com/michael-lykins/elastic-unifi-integration/issues/23
- version: "0.8.3"
  changes:
    - description: >
        Fix ECS compliance for iptables/firewall events in the events ingest pipeline.
        (1) Correct event.category from "firewall" (invalid) to "network" (ECS standard).
        (2) Set event.type ("connection" / "denied") and event.outcome ("success") for
        bracket-format iptables events. (3) Lowercase network.transport — iptables PROTO
        field is uppercase (TCP/UDP/ICMP) but ECS requires lowercase. (4) Fix source.mac
        extraction — iptables MAC= field is the full Ethernet frame header (DST:SRC:ETHERTYPE);
        now splits into destination.mac (first 6 octets) and source.mac (next 6 octets),
        formatted per RFC 7042 (uppercase, hyphen-separated). (5) Declare missing ECS fields:
        destination.mac, rule.description, observer.mac, observer.product, user.target.name,
        event.outcome.
      type: enhancement
      link: https://github.com/michael-lykins/elastic-unifi-integration/issues/23
- version: "0.8.2"
  changes:
    - description: Fix syslog panels on Overview, Clients, and Insights dashboards — syslog events now route to logs-unifi.events-* (not logs-unifi.syslog-*) since Elastic Agent 9.3.2. Update all adHocDataView index patterns and ES|QL queries to use logs-unifi.events-* so recent-window time pickers show data correctly.
      type: bugfix
      link: https://github.com/michael-lykins/elastic-unifi-integration/issues/22
- version: "0.8.1"
  changes:
    - description: Fix DHCP Events by AP/Host panel — column mapping referenced client_mac but query groups by iface, causing "invalid column" error.
      type: bugfix
      link: https://github.com/michael-lykins/elastic-unifi-integration/issues/21
- version: "0.8.0"
  changes:
    - description: Fix DPI pie chart (primaryGroups/metrics schema) and table (flat viz format) so Traffic by Category and Top 30 Apps panels render correctly. Add timeFieldName to all adHocDataViews in Devices, Topology, Firewall, and DPI dashboards so the time picker filters correctly. Widen default time range from 24h to 7d on Overview, Clients, Insights, and Firewall dashboards for better syslog/event visibility.
      type: bugfix
      link: https://github.com/michael-lykins/elastic-unifi-integration/issues/21
- version: "0.7.9"
  changes:
    - description: Add DPI dashboard with 9 panels — Total Traffic/Download/Upload/Unique-Apps KPIs, Top 15 Apps horizontal bar, Traffic by Category donut, Download vs Upload stacked bar, and detailed app table. Add DPI nav link to all 6 existing dashboards.
      type: enhancement
      link: https://github.com/michael-lykins/elastic-unifi-integration/issues/20
- version: "0.7.8"
  changes:
    - description: Remove Health dashboard — data is visible in other dashboards. Strip Health nav link from all remaining dashboard nav bars (Overview, Topology, Devices, Clients, Insights, Firewall).
      type: enhancement
      link: https://github.com/michael-lykins/elastic-unifi-integration/issues/19
- version: "0.7.7"
  changes:
    - description: Fix DPI app name resolution — use compound ID (cat*65536+app) for lookup so apps in non-IM categories (SSL/TLS=239GB, QUIC, Zoom, YouTube, Spotify, iCloud, Gmail, Apple.com, etc.) now resolve correctly instead of returning wrong category-0 names. Add missing small-ID entries (MSN, Raidcall, Beanfun). Add TRIM(client_mac) after DISSECT in DHCP queries to strip trailing newline. Fix DHCP Events by AP/Host to group by interface. Fix timeFieldName on all adHocDataViews so all KPI panels respond to dashboard time picker. Fix Health dashboard — Uptime panel was using empty snmp index; WAN Latency and Throughput panels were using zeroed-out Logstash index; all three now read from metrics-unifi.device-default.
      type: bugfix
      link: https://github.com/michael-lykins/elastic-unifi-integration/issues/18
- version: "0.7.6"
  changes:
    - description: Fix DPI data stream for UniFi Network 10.x — migrate from stat/sitedpi (dropped in v10 migration) to stat/report/daily.gw. DPI stats are now read from the embedded dpi map in the daily gateway report and parsed as per-app events, restoring app/category traffic visibility.
      type: bugfix
      link: https://github.com/michael-lykins/elastic-unifi-integration/issues/16
    - description: Fix Most Active Clients panel in Clients dashboard — was querying client.hostname (never populated); now uses DISSECT on raw message to extract client_mac from DHCP syslog entries.
      type: bugfix
      link: https://github.com/michael-lykins/elastic-unifi-integration/issues/17
- version: "0.7.5"
  changes:
    - description: Add Firewall dashboard with 15 panels — WAN attack KPIs, protocol trend, top attacking IPs, top targeted ports, attack type classification, policy zone summary, zone policy matrix (Vega heatmap), and active policy table. Add Firewall nav link to all existing dashboards.
      type: enhancement
      link: https://github.com/michael-lykins/elastic-unifi-integration/issues/15
- version: "0.7.4"
  changes:
    - description: Fix Connected Clients KPI panels (Clients, Overview, Devices dashboards) — was incorrectly summing all polling intervals producing inflated counts; now uses MAX per device in the last 2 minutes then SUM.
      type: bugfix
      link: https://github.com/michael-lykins/elastic-unifi-integration/issues/14
- version: "0.7.3"
  changes:
    - description: Format WAN Throughput as Mbps (converted from bytes/sec), Device Status Table uptime as hours, Topology Uptime chart as decimal hours.
      type: enhancement
      link: https://github.com/michael-lykins/elastic-unifi-integration/issues/13
- version: "0.7.2"
  changes:
    - description: Fix dashboard ES|QL queries to use ECS-mapped observer.type values (udm→router, uap→wap, usw→switch) after CEL template ECS migration.
      type: bugfix
      link: https://github.com/michael-lykins/elastic-unifi-integration/issues/12
- version: "0.7.1"
  changes:
    - description: Bundle all 5 dashboards (Overview, Topology, Devices, Clients, Insights) in the integration package so they install automatically and appear as Managed assets. Vega topology visualization embedded inline.
      type: enhancement
      link: https://github.com/michael-lykins/elastic-unifi-integration/issues/11
- version: "0.7.0"
  changes:
    - description: >
        ECS compliance pass across all data streams. Device identity fields moved to observer.* (observer.name, observer.mac, observer.ip, observer.version, observer.product) and device type normalized to observer.type (router/wap/switch). Events stream firewall interface fields corrected to observer.ingress/egress.interface.name. Client stream adds network.name, network.vlan.id, observer.mac and fixes client.ip to ip type. IPS event stream adds rule.name, event.action, source.geo.country_iso_code. Alarm stream adds observer.mac and source.mac. Rogue AP stream adds network.name and observer.mac. All dashboards updated to use new ECS field paths.
      type: enhancement
      link: https://github.com/michael-lykins/elastic-unifi-integration/issues/10
- version: "0.6.4"
  changes:
    - description: Add DPI app and category name resolution. Ingest pipeline now maps numeric UniFi DPI IDs to human-readable names (app_name, cat_name fields) using the complete 2,120-application and 35-category lookup table extracted directly from the UDM-Pro firmware (/usr/share/dpi/tdts/rule.json).
      type: enhancement
      link: https://github.com/michael-lykins/unifi-telemetry/issues/9
- version: "0.6.3"
  changes:
    - description: Fix DPI data stream — filter out empty records returned by the UniFi sitedpi API when no traffic has been classified (API returns [{}]). Clarify that app and cat fields are numeric IDs, not human-readable names.
      type: bugfix
      link: https://github.com/michael-lykins/unifi-telemetry/issues/9
- version: "0.6.2"
  changes:
    - description: Fix @timestamp timezone — BSD-style syslog timestamps from the UDM-Pro (America/Chicago) were being stored as UTC, placing all events 5 hours in the past. Date processor now uses America/Chicago so CDT/CST timestamps are correctly converted to UTC. ISO8601 timestamps (which carry an explicit offset) are unaffected.
      type: bugfix
      link: https://github.com/michael-lykins/unifi-telemetry/issues/8
- version: "0.6.1"
  changes:
    - description: Fix double-hostname syslog parsing so sshd, sudo, earlyoom, and other UDM-Pro system processes are correctly identified. Add authentication classification for sshd (invalid user, failed password, accepted, disconnect with source IP extraction). Add process classification for sudo. Handle device-forwarded logs from UniFi APs and switches (MAC,model process name → observer.mac + embedded PROG re-parse).
      type: bugfix
      link: https://github.com/michael-lykins/unifi-telemetry/issues/7
- version: "0.6.0"
  changes:
    - description: Add firewall_policy data stream collecting firewall rule configuration (name, action, source/destination zones, ordering index, logging state) from the UniFi Network Integration API v1.
      type: enhancement
      link: https://github.com/michael-lykins/unifi-telemetry/issues/6
- version: "0.5.0"
  changes:
    - description: Fix iptables NFLOG bracket-format parsing in events pipeline so firewall rule-hit messages correctly populate source.ip, destination.ip, rule.name, and network.transport fields.
      type: bugfix
      link: https://github.com/michael-lykins/unifi-telemetry/issues/5
- version: "0.4.0"
  changes:
    - description: Add client, health, alarm, ips_event, dpi, and rogue_ap data streams covering all major UniFi Network Local API endpoints.
      type: enhancement
      link: https://github.com/michael-lykins/unifi-telemetry/issues/4
- version: "0.3.0"
  changes:
    - description: Move UDP host config to top-level (remove udp wrapper) to fix 127.0.0.1:8080 default binding issue.
      type: bugfix
      link: https://github.com/michael-lykins/unifi-telemetry/issues/3
- version: "0.2.0"
  changes:
    - description: Fix duplicate @timestamp in device metrics; remove conflicting input-level UDP vars so per-stream listen_address/listen_port render correctly.
      type: bugfix
      link: https://github.com/michael-lykins/unifi-telemetry/issues/2
- version: "0.1.0"
  changes:
    - description: Initial release. Device metrics via UniFi Network API (CEL input) and syslog events via UDP.
      type: enhancement
      link: https://github.com/michael-lykins/unifi-telemetry/issues/1
